<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izhar Pavers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- Top Navigation Bar -->
    <nav class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md relative z-30">
        <h1 class="text-xl font-bold">Izhar Pavers</h1>
        
        <div class="flex items-center gap-2">
            <!-- Working Sign In Button -->
            <button id="signInBtn" onclick="openSignInModal()" class="bg-white text-blue-600 hover:bg-gray-100 font-bold px-4 py-2 rounded-lg text-sm transition shadow focus:outline-none cursor-pointer">
                Sign In
            </button>

            <!-- Working Menu Button -->
            <button onclick="toggleMenu()" class="bg-blue-700 hover:bg-blue-800 text-white font-semibold px-4 py-2 rounded-lg text-sm transition focus:outline-none cursor-pointer">
                ☰ Menu
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="p-6 text-center text-gray-700">
        <h2 class="text-2xl font-bold mb-2">Welcome to Izhar Pavers</h2>
        <p class="text-sm text-gray-600">Sign in karne ke liye top bar me "Sign In" button par click karein.</p>
    </main>

    <!-- ================= SIGN IN POPUP MODAL ================= -->
    <div id="signInModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 relative mx-4">
            <!-- Close Button -->
            <button onclick="closeSignInModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-xl p-1 cursor-pointer">
                ✕
            </button>

            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Sign In to Account</h2>

            <form onsubmit="handleSignIn(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">GMAIL / EMAIL ADDRESS</label>
                    <input type="email" id="signInEmail" required placeholder="talhakhan14746@gmail.com" class="w-full border border-gray-300 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">PASSWORD</label>
                    <input type="password" id="signInPassword" required placeholder="••••••••" class="w-full border border-gray-300 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow cursor-pointer">
                    Sign In
                </button>
            </form>

            <div class="mt-4 text-center">
                <button onclick="closeSignInModal()" class="text-xs text-gray-500 hover:underline cursor-pointer">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ================= SLIDE-OVER SIDE MENU ================= -->
    <div id="sideMenu" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50 overflow-y-auto p-5 hidden">
        
        <!-- Menu Header -->
        <div class="flex justify-between items-center border-b pb-3 mb-4">
            <h2 class="text-lg font-bold text-gray-800">Admin Menu</h2>
            <button onclick="toggleMenu()" class="text-gray-500 hover:text-red-600 font-bold text-xl px-2 cursor-pointer">
                ✕
            </button>
        </div>

        <!-- Owner Details -->
        <div class="p-3 bg-blue-50 border border-blue-200 rounded-lg mb-4 text-sm text-gray-800">
            <span class="block text-xs font-bold text-blue-600">OWNER ADMIN</span>
            <span class="font-medium">talhakhan14746@gmail.com</span>
        </div>

        <!-- Authorization Toggle Switch -->
        <div class="flex items-center justify-between py-2 border-b mb-4">
            <div>
                <span class="text-sm font-semibold text-gray-700 block">Authorization Access</span>
                <span class="text-xs text-gray-500">Enable/Disable access</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="authorizationToggle" class="sr-only peer">
                <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
            </label>
        </div>

        <!-- Add Authorized Gmail Input Box -->
        <div class="mb-4 space-y-1">
            <label class="block text-xs font-bold text-gray-600">ADD AUTHORIZED GMAIL</label>
            <div class="flex gap-2">
                <input type="email" id="authGmailInput" placeholder="Enter Gmail address" 
                       class="flex-1 border border-gray-300 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="addAuthorizedGmail()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition cursor-pointer">
                    Add
                </button>
            </div>
        </div>

        <!-- Authorized Gmails List -->
        <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">AUTHORIZED GMAILS LIST</label>
            <div id="authorizedGmailsContainer" class="space-y-2 max-h-60 overflow-y-auto border p-2 rounded-lg bg-gray-50">
                <!-- Dynamic Items Rendered Here -->
            </div>
        </div>
    </div>

    <!-- Backdrop Overlay -->
    <div id="menuOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-black bg-opacity-40 z-40 hidden"></div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        const OWNER_ADMIN_EMAIL = "talhakhan14746@gmail.com";

        // 1. Sign In Modal Functions
        function openSignInModal() {
            const modal = document.getElementById("signInModal");
            if (modal) {
                modal.classList.remove("hidden");
            }
        }

        function closeSignInModal() {
            const modal = document.getElementById("signInModal");
            if (modal) {
                modal.classList.add("hidden");
            }
        }

        function handleSignIn(event) {
            event.preventDefault();
            const email = document.getElementById("signInEmail").value.trim();
            alert("Success! Signed in as: " + email);
            closeSignInModal();
        }

        // 2. Menu Toggle Function
        function toggleMenu() {
            const menu = document.getElementById("sideMenu");
            const overlay = document.getElementById("menuOverlay");

            if (!menu) return;

            if (menu.classList.contains("hidden")) {
                menu.classList.remove("hidden");
                setTimeout(() => menu.classList.remove("translate-x-full"), 10);
                if (overlay) overlay.classList.remove("hidden");
            } else {
                menu.classList.add("translate-x-full");
                if (overlay) overlay.classList.add("hidden");
                setTimeout(() => menu.classList.add("hidden"), 300);
            }
        }

        // 3. Authorization Data Storage Functions
        function getStoredAuthorizedGmails() {
            try {
                const saved = localStorage.getItem("authorized_gmails_list");
                return saved ? JSON.parse(saved) : [OWNER_ADMIN_EMAIL];
            } catch (e) {
                return [OWNER_ADMIN_EMAIL];
            }
        }

        function saveAuthorizedGmails(list) {
            localStorage.setItem("authorized_gmails_list", JSON.stringify(list));
        }

        function renderAuthorizedGmailsList() {
            const container = document.getElementById("authorizedGmailsContainer");
            if (!container) return;

            const gmails = getStoredAuthorizedGmails();
            container.innerHTML = ""; 

            gmails.forEach((email) => {
                const isOwner = email.toLowerCase() === OWNER_ADMIN_EMAIL.toLowerCase();
                const item = document.createElement("div");
                item.className = "flex items-center justify-between bg-white p-2 rounded-md border border-gray-200 text-xs shadow-sm";

                item.innerHTML = `
                    <span class="font-medium text-gray-700 truncate max-w-[150px]">${email}</span>
                    ${isOwner 
                        ? '<span class="text-[10px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded">Owner</span>'
                        : `<button onclick="deleteAuthorizedGmail('${email}')" 
                                   class="bg-red-500 hover:bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded transition cursor-pointer">
                                Delete
                           </button>`
                    }
                `;
                container.appendChild(item);
            });
        }

        function addAuthorizedGmail() {
            const input = document.getElementById("authGmailInput");
            if (!input) return;

            const email = input.value.trim().toLowerCase();
            if (!email || !email.includes("@")) {
                alert("Sahi Gmail address enter karein.");
                return;
            }

            let gmails = getStoredAuthorizedGmails();
            if (gmails.includes(email)) {
                alert("Yeh Gmail pehle se list me maujood hai.");
                return;
            }

            gmails.push(email);
            saveAuthorizedGmails(gmails);
            input.value = "";
            renderAuthorizedGmailsList();
        }

        function deleteAuthorizedGmail(emailToDelete) {
            if (emailToDelete.toLowerCase() === OWNER_ADMIN_EMAIL.toLowerCase()) {
                alert("Owner email delete nahi ho sakti.");
                return;
            }

            let gmails = getStoredAuthorizedGmails();
            gmails = gmails.filter(e => e.toLowerCase() !== emailToDelete.toLowerCase());
            saveAuthorizedGmails(gmails);
            renderAuthorizedGmailsList();
        }

        // 4. Page Load Initializer
        document.addEventListener("DOMContentLoaded", () => {
            const authToggle = document.getElementById("authorizationToggle");
            if (authToggle) {
                authToggle.checked = localStorage.getItem("authorization_toggle_status") === "true";
                authToggle.addEventListener("change", (e) => {
                    localStorage.setItem("authorization_toggle_status", e.target.checked);
                });
            }
            renderAuthorizedGmailsList();
        });
    </script>
</body>
</html>
